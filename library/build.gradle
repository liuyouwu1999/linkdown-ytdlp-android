plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
    id 'com.vanniktech.maven.publish'
}

android {
    namespace 'dev.ffmpegkit_maintained.ytdlp'
    compileSdk 35

    base {
        archivesName = 'yt-dlp-android'
    }

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName VERSION

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        python {
            // Local dev : set `python.executable=/path/to/python` in local.properties
            //             (gitignored, machine-specific) or the LOCAL_PYTHON env var.
            // JitPack : python-build-standalone extracted in $HOME/python/bin.
            // GitHub Actions CI : setup-python exposes python3.13 on PATH.
            def localProps = new Properties()
            def lpFile = rootProject.file("local.properties")
            if (lpFile.exists()) lpFile.withInputStream { localProps.load(it) }
            def localPythonPath = localProps.getProperty("python.executable") ?: System.getenv("LOCAL_PYTHON")
            def jitpackPython = new File("${System.getProperty('user.home')}/python/bin/python3.13")
            if      (localPythonPath && new File(localPythonPath).exists()) { buildPython localPythonPath }
            else if (jitpackPython.exists()) { buildPython jitpackPython.absolutePath }
            else                             { buildPython "python3.13" }
            version "3.13"
            pip {
                // spike: pinned to the version resolved by the first build
                // (chaquo.com/pypi-13.1, 2026-10-15) for reproducibility.
                // Same as PyPI latest on that date.
                install "yt-dlp==2026.8.19"
                install "certifi"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

}

mavenPublishing {
    coordinates("dev.ffmpegkit-maintained", "yt-dlp-android", VERSION)

    // Sign only when GPG credentials exist: signAllPublications registers .asc
    // artifacts unconditionally, which breaks publishToMavenLocal in JitPack
    // containers (no signatory) even with -x signMavenPublication.
    if (project.hasProperty("signingInMemoryKey") || project.hasProperty("signing.keyId")) {
        signAllPublications()
    }
    publishToMavenCentral()

    pom {
        name = "yt-dlp-android"
        description = "Patched fork of yt-dlp-android (per-run cancellation, extended CLI flag whitelist, native lib injection). Embeds yt-dlp via Python 3.13 (Chaquopy)."
        inceptionYear = "2026"
        url = "https://github.com/liuyouwu1999/linkdown-ytdlp-android"

        licenses {
            license {
                name = "MIT License"
                url = "https://github.com/liuyouwu1999/linkdown-ytdlp-android/blob/master/LICENSE"
                distribution = "repo"
            }
        }

        developers {
            developer {
                id = "linkdown"
                name = "linkdown"
                email = "linkdown@users.noreply.github.com"
            }
        }

        scm {
            url = "https://github.com/liuyouwu1999/linkdown-ytdlp-android"
            connection = "scm:git:git://github.com/liuyouwu1999/linkdown-ytdlp-android.git"
            developerConnection = "scm:git:ssh://git@github.com/liuyouwu1999/linkdown-ytdlp-android.git"
        }
    }
}

// --- THIRD-PARTY-NOTICES : bundle automatique dans les assets de l'AAR ---
tasks.register("copyThirdPartyNotices", Copy) {
    from rootProject.file("THIRD-PARTY-NOTICES.txt")
    into layout.projectDirectory.dir("src/main/assets")
}
tasks.named("preBuild") { dependsOn "copyThirdPartyNotices" }
